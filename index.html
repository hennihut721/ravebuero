<title>RaveBüro</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#091C41"><meta name="apple-mobile-web-app-title" content="RaveBüro">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Handy-App mit fester Kopfzeile, einer Spalte (max. 760px) und Tab-Leiste unten; Events als Ticket-Abrisse, Flyer-Druck-Anmutung (Riso-Pink + Blau) */
:root{
  --paper:#F1F2F6; --surface:#FFFFFF; --sunk:#E7E9F0;
  --ink:#151829; --ink-2:#4A4F68; --ink-3:#767B93; --line:#D9DCE6;
  --pink:#D61E70; --pink-ink:#FFFFFF; --pink-soft:#FBE0EC;
  --blue:#2D4BB0; --blue-soft:#E0E6FA;
  --good:#1D8253; --good-soft:#DCF0E5; --warn:#A35F00; --warn-soft:#FBEACB; --bad:#BF322C; --bad-soft:#F8DDDB;
  --b-schul:#D3940E; --b-schul-t:#FAE8BE;
  --b-semester:#1A928C; --b-semester-t:#CDEDEA;
  --b-festival:#7A4DDD; --b-festival-t:#E6DCFB;
  --b-burn:#DA5A1B; --b-burn-t:#FADBC9;
  --b-urlaub:#3C8B2B; --b-urlaub-t:#DAEED2;
  --b-sonst:#7B8199; --b-sonst-t:#E1E3EA;
  --shadow:0 1px 2px rgba(21,24,41,.06),0 4px 14px rgba(21,24,41,.06);
  --scrim:rgba(21,24,41,.45);
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --f-event:var(--f-display);
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1018; --surface:#181B27; --sunk:#222636;
    --ink:#ECEEF6; --ink-2:#A8ADC3; --ink-3:#757A93; --line:#2B2F40;
    --pink:#FF519C; --pink-ink:#1C0612; --pink-soft:#3D1528;
    --blue:#91A6FF; --blue-soft:#1E2747;
    --good:#4FCB8F; --good-soft:#123324; --warn:#F2B04A; --warn-soft:#3A2B0E; --bad:#FF7B73; --bad-soft:#3E1815;
    --b-schul:#F0BA3D; --b-schul-t:#3B2F10;
    --b-semester:#45C8C1; --b-semester-t:#0F3432;
    --b-festival:#AA8CFF; --b-festival-t:#2A204C;
    --b-burn:#FF8B4D; --b-burn-t:#3E2111;
    --b-urlaub:#7DCB69; --b-urlaub-t:#1A3315;
    --b-sonst:#A0A5BA; --b-sonst-t:#272B39;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 4px 14px rgba(0,0,0,.3);
    --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1018; --surface:#181B27; --sunk:#222636;
  --ink:#ECEEF6; --ink-2:#A8ADC3; --ink-3:#757A93; --line:#2B2F40;
  --pink:#FF519C; --pink-ink:#1C0612; --pink-soft:#3D1528;
  --blue:#91A6FF; --blue-soft:#1E2747;
  --good:#4FCB8F; --good-soft:#123324; --warn:#F2B04A; --warn-soft:#3A2B0E; --bad:#FF7B73; --bad-soft:#3E1815;
  --b-schul:#F0BA3D; --b-schul-t:#3B2F10;
  --b-semester:#45C8C1; --b-semester-t:#0F3432;
  --b-festival:#AA8CFF; --b-festival-t:#2A204C;
  --b-burn:#FF8B4D; --b-burn-t:#3E2111;
  --b-urlaub:#7DCB69; --b-urlaub-t:#1A3315;
  --b-sonst:#A0A5BA; --b-sonst-t:#272B39;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 4px 14px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}

/* Ansicht „Light“ (Einstellungen): weniger Erklärtexte und Zusatzflächen */
:root[data-ansicht="light"] .lead, :root[data-ansicht="light"] .lead-more, :root[data-ansicht="light"] .banner, :root[data-ansicht="light"] .tab[data-tab="marketing"]{display:none !important}
:root[data-ansicht="light"] .tabbar-in{grid-template-columns:repeat(2,minmax(0,1fr))}
/* Ansicht „Marketing“: nur der Marketing-Reiter, alles andere über die Einstellungen */
:root[data-ansicht="marketing"] .lead, :root[data-ansicht="marketing"] .lead-more, :root[data-ansicht="marketing"] .banner, :root[data-ansicht="marketing"] .tab:not(.mo-marketing){display:none !important}
:root[data-ansicht="marketing"] .tabbar-in{grid-template-columns:repeat(4,minmax(0,1fr))}
.tab.mo{display:none}
:root[data-ansicht="marketing"] .tab.mo-marketing, :root[data-ansicht="booking"] .tab.mo-booking, :root[data-ansicht="finanzen"] .tab.mo-finanzen{display:flex}
:root[data-ansicht="booking"] .lead, :root[data-ansicht="booking"] .lead-more, :root[data-ansicht="booking"] .banner, :root[data-ansicht="booking"] .tab:not(.mo-booking),
:root[data-ansicht="finanzen"] .lead, :root[data-ansicht="finanzen"] .lead-more, :root[data-ansicht="finanzen"] .banner, :root[data-ansicht="finanzen"] .tab:not(.mo-finanzen){display:none !important}
:root[data-ansicht="booking"] .tabbar-in{grid-template-columns:repeat(4,minmax(0,1fr))}
:root[data-ansicht="finanzen"] .tabbar-in{grid-template-columns:repeat(3,minmax(0,1fr))}
/* Abend-Modus: groß, dunkel, gut im Club lesbar */
.abend{--ab-bg:#07080d;--ab-card:#141722;--ab-line:#262a38;--ab-ink:#f5f6fa;--ab-ink2:#a9adbd;background:var(--ab-bg);color:var(--ab-ink);margin:-8px -16px 0;padding:16px 16px 28px;border-radius:0 0 18px 18px;min-height:70vh}
.abend .muted{color:var(--ab-ink2)}
.ab-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ab-live{font-weight:700;color:#ff4d8d}
.ab-h1{font-size:clamp(30px,8vw,46px);font-weight:800;line-height:1.05;margin:12px 0 4px;color:var(--ab-ink)}
.ab-sub{color:var(--ab-ink2);font-size:18px;margin:0 0 16px}
.ab-card{background:var(--ab-card);border:1px solid var(--ab-line);border-radius:16px;padding:16px;margin:0 0 10px}
.ab-card.now{border-color:#ff4d8d;box-shadow:0 0 0 1px #ff4d8d inset}
.ab-k{color:var(--ab-ink2);font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.ab-name{font-size:30px;font-weight:800;line-height:1.1;margin:4px 0;overflow-wrap:anywhere}
.ab-t{font-size:20px;font-variant-numeric:tabular-nums}
.ab-sec{display:flex;align-items:center;gap:8px;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--ab-ink2);margin:22px 0 8px}
.ab-list{background:var(--ab-card);border:1px solid var(--ab-line);border-radius:16px;overflow:hidden}
.ab-list > p{padding:14px;margin:0}
.ab-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--ab-line)}
.ab-row:first-child{border-top:0}
.ab-row.now{background:rgba(255,77,141,.12)}
.ab-row.past{opacity:.45}
.ab-time{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;width:62px;flex:none}
.ab-who{flex:1;min-width:0}
.ab-name2{font-size:19px;font-weight:700;overflow-wrap:anywhere}
.ab-meta{color:var(--ab-ink2);font-size:14px}
.ab-da{flex:none;min-height:44px;min-width:64px;border-radius:12px;border:1px solid var(--ab-line);background:transparent;color:var(--ab-ink);font-weight:700;font-size:15px;cursor:pointer}
.ab-da.on{background:#1f8f55;border-color:#1f8f55;color:#fff}
.ab-tel{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:#1d2130;text-decoration:none;font-size:20px}
.ab-gl{background:var(--ab-card);border:1px solid var(--ab-line);border-radius:16px;padding:14px}
.ab-gl-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.ab-gl-top .inp{flex:1;min-width:160px;background:#0d0f17;color:var(--ab-ink);border-color:var(--ab-line)}
.ab-big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.ab-big span{font-size:16px;font-weight:600;color:var(--ab-ink2)}
.ab-gl-g{margin:14px 0 0}
.ab-gl-h{font-weight:700;margin:0 0 6px;color:var(--ab-ink2)}
.ab-gl-h span{font-weight:500}
.ab-gl-n{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 12px;margin:0 0 6px;border-radius:12px;border:1px solid var(--ab-line);background:#0d0f17;color:var(--ab-ink);font-weight:600;font-size:18px;text-align:left;cursor:pointer}
.ab-gl-n .muted{margin-left:auto}
.ab-gl-n.on{background:#123524;border-color:#1f8f55}
.ab-ck{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;border:2px solid var(--ab-line);flex:none}
.ab-ck svg{width:18px;height:18px;opacity:0}
.ab-gl-n.on .ab-ck{background:#1f8f55;border-color:#1f8f55}
.ab-gl-n.on .ab-ck svg{opacity:1;color:#fff}
.ab-gl-anon{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ab-ink2);padding:6px 2px}
.ab-gl-anon span{flex:1}
.ab-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;margin:0 0 14px;border-radius:16px;background:#07080d;color:#f5f6fa;text-decoration:none;border:1px solid #ff4d8d}
.ab-banner > span{display:flex;flex-direction:column;gap:2px}
.ab-banner .btn{flex:none}
.akt .m strong{font-weight:700}
/* Hinweisleiste */
.hw{border:1px solid var(--line);background:var(--surface);border-radius:14px;margin:0 0 14px;overflow:hidden}
.hw-z{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.hw-z:first-child{border-top:0}
.hw-z .hw-t{flex:1;min-width:0;font-size:14px}
.hw-z .hw-t strong{font-weight:700}
.hw-i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-size:14px}
.hw-x{flex:none;border:0;background:transparent;color:var(--ink-3);font-size:18px;cursor:pointer;padding:4px 6px}
.hw-neu ul{margin:6px 0 0;padding-left:18px;line-height:1.5}
/* Aufklappbare Abschnitte */
details.klapp{margin:0 0 14px}
details.klapp > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-weight:700}
details.klapp > summary::-webkit-details-marker{display:none}
details.klapp > summary::after{content:'›';margin-left:auto;color:var(--ink-3);font-size:20px;transition:transform .15s}
details.klapp[open] > summary::after{transform:rotate(90deg)}
details.klapp[open] > summary{border-radius:14px 14px 0 0;border-bottom:0}
details.klapp > .klapp-b > section.panel{border-radius:0 0 14px 14px;margin:0}
details.klapp > .klapp-b > section.panel > .panel-h > h2{display:none}
details.klapp > summary .muted{font-weight:500}
.next-step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--pink-soft, var(--sunk));margin:0 0 14px}
.next-step .t{flex:1;min-width:0}
/* Plus-Knopf */
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;width:58px;height:58px;border-radius:50%;border:0;background:var(--pink);color:var(--pink-ink, #fff);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.fab[hidden]{display:none}
/* Laden: Platzhalter */
.skel{display:grid;gap:12px;margin:8px 0}
.skel div{height:74px;border-radius:14px;background:linear-gradient(90deg,var(--sunk) 0%,var(--line) 50%,var(--sunk) 100%);background-size:200% 100%;animation:skel 1.2s infinite linear}
.skel div:nth-child(2){height:120px}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel div{animation:none}}
/* Offline */
.offline-leiste{position:sticky;top:0;z-index:30;background:#d18b00;color:#fff;text-align:center;font-size:14px;font-weight:600;padding:6px 12px}
/* Wischen */
.task.wisch{transition:transform .15s}
.toast .undo{margin-left:12px;border:0;background:transparent;color:inherit;font-weight:800;text-decoration:underline;cursor:pointer}
a.row{text-decoration:none;color:inherit}
.mkc{padding:12px 14px;border-top:1px solid var(--line)}
.mkc:first-of-type{border-top:0}
.mkc-h{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.mkc-h a{font:700 16px var(--f-body);color:var(--ink);text-decoration:none}
.mkbar{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;margin:8px 0 10px}
.mkbar span{display:block;height:100%;background:var(--pink);border-radius:999px}
.mkchk{display:flex;flex-wrap:wrap;gap:6px}
.mkchk button{border:0;cursor:pointer}
.wk{font:700 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:18px 2px 8px;display:flex;justify-content:space-between}
.wk-ev{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--pink-soft, var(--sunk));color:var(--ink);font-weight:700;text-decoration:none}
/* Farbthemen (Einstellungen) */
:root[data-farbe="lila"]{--pink:#7A3FD6; --pink-ink:#FFFFFF; --pink-soft:#EDE3FB;}
@media (prefers-color-scheme: dark){:root[data-farbe="lila"]:not([data-theme="light"]){--pink:#B48CFF; --pink-ink:#160A2A; --pink-soft:#2B1F4A;}}
:root[data-theme="dark"][data-farbe="lila"]{--pink:#B48CFF; --pink-ink:#160A2A; --pink-soft:#2B1F4A;}
:root[data-farbe="gruen"]{--pink:#0E8A5F; --pink-ink:#FFFFFF; --pink-soft:#D7F2E6;}
@media (prefers-color-scheme: dark){:root[data-farbe="gruen"]:not([data-theme="light"]){--pink:#39E6A0; --pink-ink:#04140D; --pink-soft:#0F3326;}}
:root[data-theme="dark"][data-farbe="gruen"]{--pink:#39E6A0; --pink-ink:#04140D; --pink-soft:#0F3326;}
:root[data-farbe="orange"]{--pink:#C9500C; --pink-ink:#FFFFFF; --pink-soft:#FCE3D3;}
@media (prefers-color-scheme: dark){:root[data-farbe="orange"]:not([data-theme="light"]){--pink:#FF8A3D; --pink-ink:#1F0C02; --pink-soft:#3E220F;}}
:root[data-theme="dark"][data-farbe="orange"]{--pink:#FF8A3D; --pink-ink:#1F0C02; --pink-soft:#3E220F;}
:root[data-farbe="ozean"]{--pink:#0A7AA3; --pink-ink:#FFFFFF; --pink-soft:#D6EEF7;}
@media (prefers-color-scheme: dark){:root[data-farbe="ozean"]:not([data-theme="light"]){--pink:#3CC8F0; --pink-ink:#021821; --pink-soft:#0E2F3B;}}
:root[data-theme="dark"][data-farbe="ozean"]{--pink:#3CC8F0; --pink-ink:#021821; --pink-soft:#0E2F3B;}
:root[data-farbe="rot"]{--pink:#C8102E; --pink-ink:#FFFFFF; --pink-soft:#F9DCE1;}
@media (prefers-color-scheme: dark){:root[data-farbe="rot"]:not([data-theme="light"]){--pink:#FF5C70; --pink-ink:#22050A; --pink-soft:#3F1419;}}
:root[data-theme="dark"][data-farbe="rot"]{--pink:#FF5C70; --pink-ink:#22050A; --pink-soft:#3F1419;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom, 0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:30;background:var(--paper)}
a{color:var(--blue)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* Kopfzeile */
.top{
  position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--paper);
  margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.mark{font:800 23px/1 var(--f-display);letter-spacing:.02em;color:var(--ink);text-decoration:none;text-shadow:1.5px 1.5px 0 var(--pink)}
.conn{display:inline-flex;align-items:center;gap:7px;font:500 12px var(--f-mono);color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.conn.live .dot{background:var(--good)} .conn.wait .dot{background:var(--warn)} .conn.bad .dot{background:var(--bad)}

/* Seitenkopf */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0 14px}
.vh h1{font:800 34px/.95 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
.lead{color:var(--ink-2);margin:-4px 0 14px;max-width:62ch}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px}

/* Buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px/1 var(--f-body);padding:0 15px;min-height:42px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.55;cursor:default}
.btn-primary{background:var(--pink);border-color:var(--pink);color:var(--pink-ink)}
.btn-primary:hover{border-color:var(--pink);filter:brightness(1.06)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--blue);padding:0 8px;min-height:36px}
.btn-ghost:hover{border-color:transparent;text-decoration:underline}
.btn-danger{background:transparent;color:var(--bad);border-color:var(--bad-soft)}
.btn-danger:hover{border-color:var(--bad)}
.btn-danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn-sm{min-height:34px;padding:0 12px;font-size:13px}
.iconbtn{text-decoration:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}

.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink-2);font:600 13px var(--f-body);padding:7px 13px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .n,.subtabs .n{font:500 11.5px var(--f-mono);color:var(--ink-3);margin-left:5px}

/* Pills */

async function umzug(){

  try { alt = await fs.doc('config/mitglieder').get(); } catch (e) { return; }
  const liste = alt.exists ? ((alt.data() || {}).emails || []).map(x => String(x).toLowerCase()) : [];
  if (liste.indexOf(mail) < 0) return;
  const pref = fs.collection('projects').doc('ravebuero');
  let p; try { p = await pref.get(); } catch (e) { return; }
  if (p.exists && p.data().migriert) return;
  $('#conn-t').textContent = 'Ziehe Daten ins Projekt um …';
  if (!p.exists) await pref.set({ name:'RaveBüro', owner:mail, members:liste, createdAt:Date.now(), abgleich:true });
  for (const c of ALT_COLS) {
    let snap; try { snap = await fs.collection(c).get(); } catch (e) { continue; }

      const b = fs.batch();

      await b.commit();

/* ---------- Location-Zugang: eingeschränkte Freigaben für Location-Betreiber ----------

const PARTNER_FELDER = [['lineup', 'Line-up & Running Order', true], ['flyer', 'Flyer', true], ['technik', 'Technik & Floors', true], ['gaeste', 'Gästeliste', false]];

const fgZeit = z => { const m = /^(\d{1,2}):(\d{2})/.exec(z || ''); if (!m) return 9999; const h = +m[1]; return (h < 12 ? h + 24 : h) * 60 + +m[2]; };

async function fgLauf(){
  const pid = projekt.id;
  // Bei jedem Lauf den echten Stand aus der Datenbank holen – nichts aus einem alten Zwischenspeicher
  FG.bekannt = {}; FG.fehler = FG.fehler || {};
  for (const v of (S.venues || []).filter(v => v.partnerFelder || fgMails(v).length)) {
    const fid = fgId(v);
    try { const d = await fs.collection('freigaben').doc(fid).get(); if (d.exists) FG.bekannt[fid] = d.data(); else if (fgMails(v).length) FG.bekannt[fid] = {}; } catch (e) { if (fgMails(v).length) FG.bekannt[fid] = {}; }
  }
  const t = today(), V = (S.venues || []).filter(v => fgMails(v).length);
  for (const v of V) {
    const fid = fgId(v), fel = fgFelder(v), alt = FG.bekannt[fid] || {}, altFly = {};
    (alt.events || []).forEach(x => { altFly[x.id] = x.flyer || ''; });

    const events = E.map(e => {
      const fl = S.floors.filter(f => f.eventId === e.id), flN = id => (fl.find(f => f.id === id) || {}).name || '';
      const L = S.lineup.filter(l => l.eventId === e.id && l.status === 'zugesagt').sort((a, b) => fgZeit(a.start) - fgZeit(b.start));
      const o = { id:e.id, name:e.name || '', date:e.date, start:e.start || '', end:e.end || '', status:e.status || '' };
      if (fel.lineup) o.lineup = L.map(l => ({ name:l.name || '', start:l.start || '', end:l.end || '', floor:flN(l.floorId) }));
      if (fel.technik) o.technik = fl.map(f => ({ name:f.name || 'Floor', tech:techLines(f.tech) }));
      if (fel.gaeste) o.gaeste = L.filter(l => (int(l.gl) || 0) > 0).map(l => ({ dj:l.name || '', n:int(l.gl) || 0, namen:String(l.glNames || '').split('\n').map(x => x.trim()).filter(Boolean) }));
      if (fel.flyer) { const m = mkCol('mkmedia').filter(m => m.eventId === e.id && m.kind === 'flyer' && m.bild && m.status === 'fertig').sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0))[0]; o.flyer = m ? m.id + ':' + (m.updatedAt || m.createdAt || 0) : ''; }

    } catch (e) { console.warn('Freigabe', fid, e); FG.fehler[fid] = (e && (e.code || e.message)) || String(e); }
  }

/* ===== (11) Rückmeldungen der Location-Betreiber ===== */
// Prüfsumme mit sortierten Schlüsseln – damit Web und Android denselben Wert bilden
const kanon = v => Array.isArray(v) ? '[' + v.map(kanon).join(',') + ']' : v && typeof v === 'object' ? '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + kanon(v[k])).join(',') + '}' : JSON.stringify(v === undefined ? null : v);
/* Line-up in der Betreiber-Ansicht: nach Floors unterteilt (Reihenfolge wie bei der Technik, sonst wie im Line-up) */
const pvFloors = e => { const F = []; (e.technik || []).forEach(f => { if (f.name && F.indexOf(f.name) < 0) F.push(f.name); }); (e.lineup || []).forEach(l => { if (l.floor && F.indexOf(l.floor) < 0) F.push(l.floor); }); return F; };
function pvLineup(e){

  if (!F.length) return '<ul class="rows">' + L.map(zeile).join('') + '</ul>';

const roSig = ev => fgHash(kanon({ lineup:ev.lineup || [], technik:ev.technik || [] }));
function rmStand(e){

function fgHoeren(){
  // Rückmeldungen live mitbekommen (nur Locations mit Betreiber-Zugang)
  const V = (S.venues || []).filter(v => fgMails(v).length), ids = V.map(fgId).sort().join(',');
  if (FG.hoerIds === ids) return;
  (FG.hoer || []).forEach(u => { try { u(); } catch (e) {} });
  FG.hoer = []; FG.hoerIds = ids; FG.rmDocs = {}; FG.msgDocs = {};
  V.forEach(v => {
    const fid = fgId(v);
    try { FG.hoer.push(fs.collection('freigaben').doc(fid).onSnapshot(d => { FG.rmDocs[fid] = d.exists ? d.data() : null; rmAufbauen(); }, () => {})); } catch (e) {}
    try { FG.hoer.push(fs.collection('freigaben').doc(fid).collection('nachrichten').onSnapshot(sn => { FG.msgDocs[fid] = sn.docs.map(d => Object.assign({ id:d.id, fid }, d.data())); nmLog(fid); scheduleRender(); }, () => {})); } catch (e) {}
  });

function rmAufbauen(){

/* ===== Nachrichten mit den Location-Betreibern =====

/* ===== (6) Abrechnung ===== */
function abrechnung(e){
  const c = calc(e), ist = e.ist || {}, hatIst = ['ak', 'vvk', 'bar'].some(k => ist[k] != null && ist[k] !== '');
  const tix = hatIst ? (num(ist.ak) || 0) + (num(ist.vvk) || 0) : c.tickets;
  const bar = num(ist.bar) || 0, ein = tix + bar + c.incSum, aus = c.totalOut, erg = ein - aus;
  const n = Math.max(1, int(e.anteile) || ((projekt && projekt.members) || []).length || 1);
  const L = S.lineup.filter(l => l.eventId === e.id && l.status !== 'abgesagt' && num(l.fee) > 0 && !l.paid);
  const K = S.money.filter(m => m.eventId === e.id && m.kind === 'ausgabe' && !m.paid);
  const E = S.money.filter(m => m.eventId === e.id && m.kind === 'einnahme' && !m.paid);
  return { hatIst, tix, bar, inc:c.incSum, ein, aus, erg, n, pro:erg / n, gaeste:int(ist.gaeste) || 0, offenAus:L.map(l => [l.name + ' (Gage)', num(l.fee), 'lineup', l.id]).concat(K.map(m => [m.label || m.category || 'Kosten', num(m.amount), 'money', m.id])), offenEin:E.map(m => [m.label || m.category || 'Einnahme', num(m.amount), 'money', m.id]) };
}

async function altImport(){

    const ops = [];
    for (const c of Object.keys(data)) {
      const da = new Set((await db.collection(c).get()).docs.map(d => d.id));

  } catch (e) { toast('Import fehlgeschlagen: ' + (e && e.message || e)); }

}

/* Kalender */
function dayMap(y){
  const map = {}, a = y + '-01-01', z = y + '-12-31';
  const get = d => map[d] || (map[d] = { b:[], s:[], e:[] });
  S.blockers.forEach(b => {
    if (calOff(b) || !isDate(b.from) || !isDate(b.to) || b.to < a || b.from > z || b.to < b.from || S.hidden.indexOf(btKey(b)) >= 0) return;
    let d = b.from < a ? a : b.from; const end = b.to > z ? z : b.to;
    const hard = isHard(b);
    for (let i = 0; d <= end && i < 400; i++) { (hard ? get(d).b : get(d).s).push(b); d = addDays(d, 1); }
  });
  S.events.forEach(e => { if (isDate(e.date) && e.date.slice(0, 4) === String(y) && e.status !== 'abgesagt') get(e.date).e.push(e); });
  if (S.hidden.indexOf('lokal') < 0) S.local.forEach(l => { if (isDate(l.date) && l.date.slice(0, 4) === String(y) && !lpEvent(l) && !lpHidden(l)) { const x = get(l.date); (x.l = x.l || []).push(l); } });
  return map;
}

  if (S.legendOpen) h += '<div class="legend" role="group" aria-label="Arten ein- und ausblenden">' + Object.keys(BT).map(k => '<button class="lg" data-act="bt-toggle" data-v="' + k + '" aria-pressed="' + (S.hidden.indexOf(k) < 0) + '"><span class="sw t-' + BT[k].v + '"></span>' + BT[k].label + '</button>').join('') + '<button class="lg" data-act="bt-toggle" data-v="lokal" aria-pressed="' + (S.hidden.indexOf('lokal') < 0) + '"><span class="sw lp"></span>Partys in der Region</button><span class="lg"><span class="sw ev"></span>Event</span><span class="lg"><span class="sw-u"></span>Unterstrichen: zum Einschätzen</span></div>';

}

async function mkInstaBlob(src){

  const r = await fetch('https://openholidaysapi.org/SchoolHolidays?countryIsoCode=DE&languageIsoCode=DE&validFrom=' + today() + '&validTo=' + bis + '&subdivisionCode=DE-' + code);
  if (!r.ok) throw new Error('Ferien-Dienst antwortet nicht (' + r.status + ')');
  const j = await r.json();
  return (Array.isArray(j) ? j : []).filter(x => isDate(x.startDate) && isDate(x.endDate)).map(x => ({
    from:x.startDate, to:x.endDate,
    name:(((x.name || []).find(n => n.language === 'DE') || (x.name || [])[0] || {}).text || 'Schulferien') + ' ' + landName(code) +
      ((x.subdivisions || []).length && x.subdivisions.every(s => s.code && s.code.split('-').length > 2) ? ' (' + x.subdivisions.map(s => s.shortName).join(', ') + ')' : '')

}

// Trägt fehlende Ferien der gewählten Länder ein (bestehende Einträge und Bewertungen bleiben unverändert)
async function ferienSync(still){
  if (!db || !projekt || ferienLaeuft) return;
  const sch = fLaender('schulLaender'), sem = fLaender('semLaender');
  if (!sch.length && !sem.length && projekt.ferienAltWeg) return;
  ferienLaeuft = true; if (!still) render();
  let neu = 0, fehler = '';
  try {
    const da = S.blockers;
    // Nur automatisch eingetragene Ferien zählen als „schon da“ – die früher von Hand angelegten werden unten einmalig ersetzt
    const dup = (type, from, to, land) => da.some(b => b.auto && b.type === type && b.from === from && b.to === to && String(b.name || '').indexOf(land) >= 0);
    const neuL = [];
    const b = fs.batch(); let n = 0;
    for (const c of sch) {
      let L; try { L = await schulTermine(c); } catch (e) { fehler = e.message; continue; }
      L.forEach(x => { const id = ferienId('sf', c, x.from, x.name); if (da.some(q => q.id === id) || dup('schulferien', x.from, x.to, landName(c))) return;
        b.set(db.collection('blockers').doc(id), { type:'schulferien', name:x.name, from:x.from, to:x.to, soft:true, rating:'offen', notes:'', land:c, auto:true }); neuL.push({ id, type:'schulferien', from:x.from, to:x.to }); n++; });
    }
    if (sem.length) {
      await fs.collection('ferienwissen').doc('_wunsch').set({ laender:firebase.firestore.FieldValue.arrayUnion(...sem) }, { merge:true }).catch(() => {});
      for (const c of sem) (await semTermine(c)).forEach(x => { const nm = (x.name || 'Semesterferien') + ' ' + landName(c), id = ferienId('sem', c, x.from, nm); if (da.some(q => q.id === id) || dup('semesterferien', x.from, x.to, landName(c))) return;
        b.set(db.collection('blockers').doc(id), { type:'semesterferien', name:nm, from:x.from, to:x.to, soft:true, rating:'offen', notes:x.hochschulen || '', land:c, auto:true }); neuL.push({ id, type:'semesterferien', from:x.from, to:x.to }); n++; });
    }
    if (n) await b.commit();
    neu = n;
    // Einmalig: die früher von Hand eingestellten Schul- und Semesterferien entfernen (Bewertungen gehen auf die neuen Einträge über)
    if (!projekt.ferienAltWeg && !fehler) {
      const alt = da.filter(x => (x.type === 'schulferien' || x.type === 'semesterferien') && !x.auto);
      const autos = da.filter(x => x.auto).concat(neuL);
      const b2 = fs.batch();
      alt.forEach(x => {
        const tw = autos.find(a => a.type === x.type && a.from === x.from && a.to === x.to);
        if (tw) { const u = {}; if (x.rating && x.rating !== 'offen') u.rating = x.rating; if (x.off) u.off = true; if (x.count === false) u.count = false; if (Object.keys(u).length) b2.update(db.collection('blockers').doc(tw.id), u); }
        b2.delete(db.collection('blockers').doc(x.id));
      });
      b2.update(fs.collection('projects').doc(projekt.id), { ferienAltWeg:true });
      await b2.commit(); projekt.ferienAltWeg = true;
    }
    await fs.collection('projects').doc(projekt.id).update({ ferienStand:Date.now() }).catch(() => {});
  } catch (e) { fehler = e && e.message || String(e); }
  ferienLaeuft = false; render();
  if (!still || neu || fehler) toast(fehler ? 'Ferien: ' + fehler : neu ? neu + (neu === 1 ? ' Ferientermin' : ' Ferientermine') + ' eingetragen.' : 'Ferien sind aktuell.');
}

async function ferienToggle(k, code){
  if (!projekt || S.ro) return;
  S.flOpen = k === 'schulLaender' ? 'schul' : 'sem';
  const sel = fLaender(k), an = sel.indexOf(code) < 0;
  const typ = k === 'schulLaender' ? 'schulferien' : 'semesterferien', land = landName(code);
  if (!an) {
    const weg = S.blockers.filter(b => b.type === typ && (b.land === code || (!b.land && String(b.name || '').indexOf(land) >= 0)));
    if (weg.length && !confirm((typ === 'schulferien' ? 'Schulferien ' : 'Semesterferien ') + land + ' abwählen? ' + weg.length + (weg.length === 1 ? ' Eintrag wird' : ' Einträge werden') + ' entfernt.')) return;
    const b = fs.batch(); weg.forEach(x => b.delete(db.collection('blockers').doc(x.id))); b.update(fs.collection('projects').doc(projekt.id), { [k]:firebase.firestore.FieldValue.arrayRemove(code) });

  ferienSync(k === 'semLaender');
}

    const who = await resolvePerson(f, d.who, d.whoNew); if (who === false) return;
    const alt = S.tasks.find(x => x.id === f.dataset.id) || {};
    const upd = { title, whoId:who.id, who:who.name, due:isDate(d.due) ? d.due : '', prio:PRIO[d.prio] ? d.prio : '', done:!!d.done };
    if (who.id && who.id !== alt.whoId) Object.assign(upd, { assignedAt:Date.now(), assignedBy:meinName() });
    if (await save(() => db.doc('tasks/' + f.dataset.id).update(upd), 'Gespeichert')) {
      closeSheet();
      if (upd.assignedAt) logA('hat ' + who.name + ' die Aufgabe „' + title + '“ gegeben', alt.eventId);
      else if (upd.done && !alt.done) logA('hat „' + title + '“ erledigt', alt.eventId);
    }
  },
  async person(f, d){
    const name = (d.name || '').trim();
    if (!name) return formErr(f, 'Gib einen Namen ein.');
    const id = f.dataset.id;
    if (S.people.some(p => p.id !== id && (p.name || '').toLowerCase() === name.toLowerCase())) return formErr(f, name + ' ist schon im Team.');
    if (f.dataset.quick) {
      const pid = newId('pp'); S.quick.who = pid;
      if (await save(() => db.collection('people').doc(pid).set({ name, createdAt:Date.now() }), name + ' ist im Team')) { closeSheet(); render(); } else S.quick.who = '';
      return;
    }
    S.afterPeople = 'team';
    const em = String(d.email || '').toLowerCase();
    const ok = id ? await save(() => db.doc('people/' + id).update({ name, email:em }), 'Gespeichert') : await save(() => db.collection('people').doc(newId('pp')).set({ name, email:em, createdAt:Date.now() }), name + ' ist im Team');

  },
  async blocker(f, d){
    const name = (d.name || '').trim();
    if (!name) return formErr(f, 'Gib dem Eintrag einen Namen.');
    if (!isDate(d.from) || !isDate(d.to)) return formErr(f, 'Wähle Start- und Enddatum.');
    if (d.to < d.from) return formErr(f, 'Das Enddatum liegt vor dem Startdatum.');
    const soft = d.mode === 'weich';
    const data = { name, type:d.type || 'sonstiges', from:d.from, to:d.to, notes:(d.notes || '').trim(), soft, rating: soft ? (RATING[d.rating] ? d.rating : 'offen') : '' };
    const ex = data.type === 'burningman' || data.type === 'festival', url = (d.url || '').trim();
    if (ex && url && !safeUrl(url)) return formErr(f, 'Gib die Website mit https:// an.');
    Object.assign(data, { place: ex ? (d.place || '').trim().slice(0, 120) : '', country: ex ? (d.country || '').trim().slice(0, 60) : '', url: ex ? url.slice(0, 300) : '' });
    data.km = ex && int(d.km) > 0 ? int(d.km) : 0;
    if (data.type === 'burningman') data.series = (d.series || '').trim() || name.replace(/\s*(19|20)\d{2}$/, '').trim();
    const id = f.dataset.id;
    if (id) { if (await save(() => db.doc('blockers/' + id).update(data), 'Gespeichert')) closeSheet(); return; }
    if (await save(() => db.collection('blockers').doc(newId('b')).set(data), data.type === 'burningman' ? 'Burn angelegt' : data.type === 'festival' ? 'Festival angelegt' : soft ? 'Ferien angelegt' : 'Sperrtermin angelegt')) closeSheet();
  },
  async fsearch(f, d){
    const q = (d.q || '').trim().slice(0, 120);
    if (q.length < 2) { toast('Gib ein, wonach du suchen willst.'); return; }
    if (S.fsearch.some(x => (x.status === 'offen' || x.status === 'läuft') && Date.now() - (x.at || 0) < 10 * 60000)) { toast('Warte kurz, bis die laufende Suche fertig ist.'); return; }
    const id = newId('fs');
    if (!await save(() => db.collection('fsearch').doc(id).set({ q, status:'offen', at:Date.now() }), 'Suche gestartet')) return;
    S.fsQ = '';
    fsFire(id, q);
  },
  async 'quick-task'(f, d){
    const title = (d.title || '').trim();
    if (!title) { toast('Schreib zuerst, was zu tun ist.'); return; }
    const p = S.people.find(x => x.id === d.who);
    const data = { eventId:f.dataset.ev, title, whoId:p ? p.id : '', who:p ? p.name : '', due:isDate(d.due) ? d.due : '', prio:PRIO[d.prio] ? d.prio : '', done:false, createdAt:Date.now() };
    if (p) { data.assignedAt = Date.now(); data.assignedBy = meinName(); logA('hat ' + p.name + ' die Aufgabe „' + title + '“ gegeben', f.dataset.ev); }
    S.quick.title = ''; S.quick.due = ''; S.quick.prio = '';
    ['#quick-task', '#quick-due', '#quick-prio'].forEach(q => { const x = f.querySelector(q); if (x) x.value = ''; });
    await save(() => db.collection('tasks').doc(newId('t')).set(data));
  }
};

async function doDelete(kind, id){
  if (kind === 'event') {
    const e = S.events.find(x => x.id === id); if (!e) return;
    const kids = [];
    ['lineup', 'money', 'tasks', 'phases', 'floors'].forEach(c => S[c].forEach(x => { if (x.eventId === id) kids.push([c, x]); }));
    const ok = await save(async () => { await db.doc('events/' + id).delete(); await Promise.all(kids.map(k => db.doc(k[0] + '/' + k[1].id).delete())); });
    if (ok) { location.hash = 'events'; logA('hat das Event „' + (e.name || 'Event') + '“ gelöscht'); undoToast('Event gelöscht', async () => { await db.doc('events/' + id).set(roh(e)); await Promise.all(kids.map(k => db.doc(k[0] + '/' + k[1].id).set(roh(k[1])))); }); }
    return;
  }
  if (kind === 'floor') {
    const f = S.floors.find(x => x.id === id), L = S.lineup.filter(l => l.floorId === id);
    if (await save(async () => { await db.doc('floors/' + id).delete(); for (const l of L) await db.doc('lineup/' + l.id).update({ floorId:'' }); })) {
      closeSheet(); if (f) undoToast('Floor gelöscht', async () => { await db.doc('floors/' + id).set(roh(f)); for (const l of L) await db.doc('lineup/' + l.id).update({ floorId:id }); });
    }
    return;
  }
  const col = { lineup:'lineup', money:'money', task:'tasks', blocker:'blockers', phase:'phases', watch:'watch', techset:'techsets', person:'people' }[kind];
  if (!col) return;
  const x = (S[col] || []).find(q => q.id === id);
  if (kind === 'person') S.afterPeople = 'team';
  const ok = await save(() => db.doc(col + '/' + id).delete());
  if (!ok) { if (kind === 'person') S.afterPeople = null; return; }
  if (kind === 'techset') techsetsSheet(); else if (kind !== 'person') closeSheet();
  const msg = { watch:'Entfernt', person:'Aus dem Team entfernt', techset:'Setup gelöscht' }[kind] || 'Gelöscht';
  if (x) undoToast(msg, () => db.doc(col + '/' + id).set(roh(x)));
}
