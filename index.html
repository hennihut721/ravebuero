<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>RaveBüro</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#091C41"><meta name="apple-mobile-web-app-title" content="RaveBüro">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Handy-App mit fester Kopfzeile, einer Spalte (max. 760px) und Tab-Leiste unten; Events als Ticket-Abrisse, Flyer-Druck-Anmutung (Riso-Pink + Blau) */
:root{
  --paper:#F1F2F6; --surface:#FFFFFF; --sunk:#E7E9F0;
  --ink:#151829; --ink-2:#4A4F68; --ink-3:#767B93; --line:#D9DCE6;
  --pink:#D61E70; --pink-ink:#FFFFFF; --pink-soft:#FBE0EC;
  --blue:#2D4BB0; --blue-soft:#E0E6FA;
  --good:#1D8253; --good-soft:#DCF0E5; --warn:#A35F00; --warn-soft:#FBEACB; --bad:#BF322C; --bad-soft:#F8DDDB;
  --b-schul:#D3940E; --b-schul-t:#FAE8BE;
  --b-semester:#1A928C; --b-semester-t:#CDEDEA;
  --b-festival:#7A4DDD; --b-festival-t:#E6DCFB;
  --b-burn:#DA5A1B; --b-burn-t:#FADBC9;
  --b-urlaub:#3C8B2B; --b-urlaub-t:#DAEED2;
  --b-sonst:#7B8199; --b-sonst-t:#E1E3EA;
  --shadow:0 1px 2px rgba(21,24,41,.06),0 4px 14px rgba(21,24,41,.06);
  --scrim:rgba(21,24,41,.45);
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --f-event:var(--f-display);
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1018; --surface:#181B27; --sunk:#222636;
    --ink:#ECEEF6; --ink-2:#A8ADC3; --ink-3:#757A93; --line:#2B2F40;
    --pink:#FF519C; --pink-ink:#1C0612; --pink-soft:#3D1528;
    --blue:#91A6FF; --blue-soft:#1E2747;
    --good:#4FCB8F; --good-soft:#123324; --warn:#F2B04A; --warn-soft:#3A2B0E; --bad:#FF7B73; --bad-soft:#3E1815;
    --b-schul:#F0BA3D; --b-schul-t:#3B2F10;
    --b-semester:#45C8C1; --b-semester-t:#0F3432;
    --b-festival:#AA8CFF; --b-festival-t:#2A204C;
    --b-burn:#FF8B4D; --b-burn-t:#3E2111;
    --b-urlaub:#7DCB69; --b-urlaub-t:#1A3315;
    --b-sonst:#A0A5BA; --b-sonst-t:#272B39;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 4px 14px rgba(0,0,0,.3);
    --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1018; --surface:#181B27; --sunk:#222636;
  --ink:#ECEEF6; --ink-2:#A8ADC3; --ink-3:#757A93; --line:#2B2F40;
  --pink:#FF519C; --pink-ink:#1C0612; --pink-soft:#3D1528;
  --blue:#91A6FF; --blue-soft:#1E2747;
  --good:#4FCB8F; --good-soft:#123324; --warn:#F2B04A; --warn-soft:#3A2B0E; --bad:#FF7B73; --bad-soft:#3E1815;
  --b-schul:#F0BA3D; --b-schul-t:#3B2F10;
  --b-semester:#45C8C1; --b-semester-t:#0F3432;
  --b-festival:#AA8CFF; --b-festival-t:#2A204C;
  --b-burn:#FF8B4D; --b-burn-t:#3E2111;
  --b-urlaub:#7DCB69; --b-urlaub-t:#1A3315;
  --b-sonst:#A0A5BA; --b-sonst-t:#272B39;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 4px 14px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom, 0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:30;background:var(--paper)}
a{color:var(--blue)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)}
.small{font-size:12.5px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* Kopfzeile */
.top{
  position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--paper);
  margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.mark{font:800 23px/1 var(--f-display);letter-spacing:.02em;color:var(--ink);text-decoration:none;text-shadow:1.5px 1.5px 0 var(--pink)}
.conn{display:inline-flex;align-items:center;gap:7px;font:500 12px var(--f-mono);color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.conn.live .dot{background:var(--good)} .conn.wait .dot{background:var(--warn)} .conn.bad .dot{background:var(--bad)}

/* Seitenkopf */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0 14px}
.vh h1{font:800 34px/.95 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
.lead{color:var(--ink-2);margin:-4px 0 14px;max-width:62ch}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 14px}

/* Buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px/1 var(--f-body);padding:0 15px;min-height:42px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.55;cursor:default}
.btn-primary{background:var(--pink);border-color:var(--pink);color:var(--pink-ink)}
.btn-primary:hover{border-color:var(--pink);filter:brightness(1.06)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--blue);padding:0 8px;min-height:36px}
.btn-ghost:hover{border-color:transparent;text-decoration:underline}
.btn-danger{background:transparent;color:var(--bad);border-color:var(--bad-soft)}
.btn-danger:hover{border-color:var(--bad)}
.btn-danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn-sm{min-height:34px;padding:0 12px;font-size:13px}
.iconbtn{text-decoration:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}

.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink-2);font:600 13px var(--f-body);padding:7px 13px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .n,.subtabs .n{font:500 11.5px var(--f-mono);color:var(--ink-3);margin-left:5px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap;vertical-align:middle}
.pill svg{width:12px;height:12px}
.st-planung{background:var(--blue-soft);color:var(--blue)}
.st-ok{background:var(--good-soft);color:var(--good)}
.st-bad{background:var(--bad-soft);color:var(--bad)}
.st-warn{background:var(--warn-soft);color:var(--warn)}
.t-schul{--c:var(--b-schul);--t:var(--b-schul-t)}
.t-semester{--c:var(--b-semester);--t:var(--b-semester-t)}
.t-festival{--c:var(--b-festival);--t:var(--b-festival-t)}
.t-burn{--c:var(--b-burn);--t:var(--b-burn-t)}
.t-urlaub{--c:var(--b-urlaub);--t:var(--b-urlaub-t)}
.t-sonst{--c:var(--b-sonst);--t:var(--b-sonst-t)}
.u-schul{--c2:var(--b-schul)} .u-semester{--c2:var(--b-semester)} .u-festival{--c2:var(--b-festival)}
.u-burn{--c2:var(--b-burn)} .u-urlaub{--c2:var(--b-urlaub)} .u-sonst{--c2:var(--b-sonst)}
.pill.bt{background:var(--t);color:var(--ink)}
.pill.bt::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}

/* Banner, Hinweise */
.banner{border-radius:var(--r);padding:12px 14px;margin:0 0 14px;font-size:14px;background:var(--blue-soft);color:var(--ink)}
.banner.warn{background:var(--warn-soft)}
.banner .btn-ghost{margin-left:-8px}
.alert{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin:0 0 14px}
.alert > svg{color:var(--warn);flex:none;margin-top:2px}
.alert strong{display:block;margin-bottom:4px}
.alert ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.alert li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px}
.free{display:flex;align-items:center;gap:8px;color:var(--good);font-weight:600;margin:0;font-size:14px}
.loading{display:flex;align-items:center;gap:10px;color:var(--ink-2);padding:24px 4px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--pink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.empty{padding:24px 18px;background:var(--surface);border-radius:var(--r);border:1.5px dashed var(--line)}
.empty h3{font:800 26px/1 var(--f-display);text-transform:uppercase;margin:0 0 8px}
.empty p{color:var(--ink-2);margin:0 0 14px;max-width:48ch}

/* Tickets (Event-Liste) */
.tickets{display:grid;gap:12px}
.wtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px}
.wtop h2{font:800 22px/1 var(--f-display);text-transform:uppercase;margin:0;letter-spacing:.02em}
.wgrid{display:grid;gap:12px;margin:0 0 22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.wgrid > .ws-l{grid-column:1 / -1}}
@media (min-width:960px){body.wide .wrap,body.wide .top-in,body.wide .tabbar-in{max-width:1180px}.wgrid{grid-template-columns:repeat(4,minmax(0,1fr))}.wgrid > .ws-m{grid-column:span 2}.wgrid > .ws-l{grid-column:1 / -1}body.wide .tickets{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wcell{position:relative;min-width:0;display:flex;flex-direction:column}
.w-hi{margin:-4px 0 10px;color:var(--ink-2);font-size:15px}
.wstrip{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.wchip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font:600 13px var(--f-body);color:var(--ink);text-decoration:none;max-width:100%}
.wchip svg{width:15px;height:15px;flex:none}
.wchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wchip.w{background:var(--warn-soft)} .wchip.w svg{color:var(--warn)}
.wchip.ok{background:var(--good-soft);color:var(--good)}
.wchip.ev svg{color:var(--pink)}
.wd-h h3{display:flex;align-items:center;gap:8px;min-width:0}
.wd-h h3 svg{width:17px;height:17px;flex:none;color:var(--pink)}
.wd-h h3 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wtop .btns{display:flex;gap:8px;flex-wrap:wrap}
.w-edit{display:none}
.editing .w-edit{display:flex;align-items:center;gap:6px;padding:6px 8px;margin:0 0 6px;background:var(--ink);color:var(--paper);border-radius:12px;font:600 13px var(--f-body)}
.editing .w-edit .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-edit button{border:0;background:rgba(255,255,255,.12);color:inherit;border-radius:8px;min-width:32px;height:32px;cursor:pointer;font:700 15px var(--f-body);display:grid;place-items:center;padding:0 6px}
.w-edit button:disabled{opacity:.35;cursor:default}
.w-edit .wsz{background:rgba(255,255,255,.12)} .w-edit .wsz button{background:transparent;height:26px;min-width:26px;font-size:12px;color:inherit}
.w-edit .wsz button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.w-edit .w-grip{cursor:grab;touch-action:none}
.editing > .wd,.editing > .dash{pointer-events:none;opacity:.8}
.wcell.moving{opacity:.5}
.wcell.drop{outline:2px dashed var(--pink);outline-offset:3px;border-radius:var(--r)}
.wcell:not(.editing) .w-rs{display:none}
.wadd{border:2px dashed var(--line);border-radius:var(--r);background:transparent;min-height:120px;display:grid;place-items:center;gap:6px;color:var(--ink-2);font:600 15px var(--f-body);cursor:pointer;padding:18px}
.wadd:hover{border-color:var(--pink);color:var(--pink)}
.wpick{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.wpick button{width:100%;text-align:left;display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.wpick button:hover{border-color:var(--pink)}
.wpick svg{width:20px;height:20px;color:var(--pink);flex:none}
.wpick small{display:block;color:var(--ink-3);font-size:12.5px}
.wopt{display:grid;gap:10px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.wopt:hover,.wopt:focus-visible{border-color:var(--pink);outline:none}
.wopt-h{display:flex;gap:12px;align-items:center}
.wopt-h svg{width:20px;height:20px;color:var(--pink);flex:none}
.wopt-h .btn{margin-left:auto;pointer-events:none}
.wprev{position:relative;max-height:190px;overflow:hidden;pointer-events:none;border-radius:12px;background:var(--paper);padding:8px}
.wprev > *{transform:scale(.82);transform-origin:top left;width:122%}
.wprev::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(transparent,var(--paper))}
.wcell > .wd,.wcell > .dash{flex:1;margin:0;min-width:0}
.wcell.drag{outline:2px dashed var(--pink);outline-offset:3px;border-radius:var(--r)}
.w-rs{position:absolute;right:4px;bottom:4px;width:30px;height:30px;border:0;background:transparent;color:var(--ink-3);cursor:nwse-resize;touch-action:none;display:grid;place-items:center;border-radius:8px;padding:0;z-index:2}
.w-rs:hover,.wcell.drag .w-rs{color:var(--pink);background:var(--sunk)}
.w-rs svg{width:16px;height:16px}
.w-size{font:600 11px var(--f-mono);color:var(--ink-3);position:absolute;right:38px;bottom:11px;pointer-events:none;display:none}
.wcell.drag .w-size{display:block;color:var(--pink)}
.wsz{display:inline-flex;gap:2px;background:var(--sunk);border-radius:999px;padding:2px}
.wsz button{border:0;background:transparent;font:600 12px var(--f-body);padding:4px 8px;border-radius:999px;cursor:pointer;color:var(--ink-2)}
.wsz button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.wd{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;min-width:0;display:flex;flex-direction:column}
.wd-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px 8px}
.wd-h h3{font:800 18px/1 var(--f-display);text-transform:uppercase;margin:0;letter-spacing:.02em}
.wd-h a{font-size:13px;color:var(--blue);text-decoration:none;white-space:nowrap}
.wd-b{padding:0 14px 14px;font-size:14px;min-width:0}
.wd-b .muted{margin:0}
.wl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.wl li{display:flex;gap:10px;align-items:center;min-width:0}
.wl .d{font:500 12px var(--f-mono);color:var(--ink-2);min-width:58px;flex:none}
.wl .m{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl .m small{display:block;color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.wl a{color:inherit;text-decoration:none}
.wsel{width:100%;font:500 14px var(--f-body);padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);color:var(--ink);margin:0 0 10px;min-height:38px}
.wl li > a{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.wl a:hover .m{text-decoration:underline}
.wl .r{flex:none;margin-left:auto}
.wl .chk{width:20px;height:20px;border-radius:6px}
.wstat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 10px}
.wstat > div{background:var(--sunk);border-radius:10px;padding:8px 10px;min-width:0}
.wstat .k{font:600 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.wstat .v{font:800 18px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px;position:relative}
.mbar span{display:block;height:100%;background:var(--pink)}
.mbar i{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center}
.mini span{font:500 11px var(--f-mono);padding:5px 0 3px;border-radius:6px;background:var(--sunk);position:relative;color:var(--ink-2)}
.mini span.h{background:none;color:var(--ink-3);font-size:9.5px}
.mini span.e{background:var(--pink);color:var(--pink-ink);font-weight:600}
.mini span.b{background:var(--warn-soft)}
.mini span.p::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--blue)}
.mini span.t{box-shadow:inset 0 0 0 1.5px var(--ink)}
.mini span.x{opacity:.4}
.wcfg{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:4px}
.wcfg li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.wcfg label{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer;font-size:15px}
.wcfg label small{display:block;color:var(--ink-3);font-size:12.5px}
.wcfg .iconbtn{width:34px;height:34px}
.dash{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);margin:0 0 18px;overflow:hidden}
.dash-h{display:flex;gap:14px;align-items:center;padding:16px 14px 14px;color:inherit;text-decoration:none;background:linear-gradient(120deg,var(--pink-soft),transparent 75%);border-bottom:1px solid var(--line)}
.dash-h > svg{flex:none;color:var(--ink-3)}
.dash-cd{flex:none;min-width:66px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dash-cd .n{font:800 46px/.9 var(--f-display);color:var(--pink)}
.dash-cd .n.w{font-size:26px;text-transform:uppercase}

.dash-t h2{font:800 28px/1 var(--f-event);text-transform:uppercase;letter-spacing:.01em;margin:3px 0 6px;overflow-wrap:anywhere}
.dash-t .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px;color:var(--ink-2)}

.checks a{color:var(--blue)}
.dash .rows > li:first-child{border-top:0}
.dash .task{padding:8px 0}
.dash-f{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--sunk);flex-wrap:wrap}

.ticket{display:grid;grid-template-columns:78px minmax(0,1fr);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);color:inherit;text-decoration:none;position:relative;overflow:hidden;min-height:112px}
.ticket::before,.ticket::after{content:"";position:absolute;left:77px;width:16px;height:16px;border-radius:50%;background:var(--paper);transform:translateX(-50%)}
.ticket::before{top:-8px} .ticket::after{bottom:-8px}
.ticket:hover h3{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

.stub .dd{font:800 46px/.86 var(--f-display);color:var(--pink)}
.tbody{padding:12px 14px 12px 16px;min-width:0;display:flex;flex-direction:column;gap:5px}

/* Event-Detail */
.back{font:600 14px var(--f-body);color:var(--blue);text-decoration:none;display:inline-flex;align-items:center;gap:2px;padding:6px 0;margin-left:-4px}

.ev-hero{margin:4px 0 16px}
.ev-date{font:500 13px var(--f-mono);color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.ev-hero h1{font:800 36px/.95 var(--f-event);text-transform:uppercase;margin:8px 0 10px;overflow-wrap:anywhere;text-wrap:balance}
.ev-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;color:var(--ink-2);font-size:14px}
.tabs-wrap{position:relative;margin:0 0 16px}
.tabs-wrap::after{content:"";position:absolute;right:0;top:0;bottom:1px;width:28px;background:linear-gradient(to right, transparent, var(--paper));pointer-events:none}
.subtabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;padding-right:20px}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 16px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.kpi .k{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.kpi .v{font:800 32px/1.05 var(--f-display);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12.5px;color:var(--ink-2)}

.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);margin:0 0 16px;overflow:hidden}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px 8px}
.panel-h h2{font:800 21px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0}
.pad{padding:2px 14px 14px;margin:0;color:var(--ink-2);font-size:14px}
.rows{list-style:none;margin:0;padding:0}
.rows > li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-width:0;width:100%;text-align:left;background:none;border:0;cursor:pointer}
li.row,div.row{cursor:default}
button.row:hover{background:var(--sunk)}
.row-main{flex:1;min-width:0;display:block}
.row-title{display:block;font-weight:600;overflow-wrap:anywhere}
.row-sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px;color:var(--ink-2);margin-top:2px}
.ok-t{color:var(--good)}
.foot{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-top:1px solid var(--line);background:var(--sunk);font-size:14px;color:var(--ink-2)}
.foot .num{color:var(--ink);font-weight:600}
.dl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:9px 14px;padding:4px 14px 14px;margin:0}
.dl dt{color:var(--ink-3);font-size:13px;padding-top:1px}
.dl dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.danger-zone{display:flex;justify-content:flex-end;margin:0 0 16px}

/* Geld */
.sum-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 20px;padding:14px 14px 4px}
.sum-top .k{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.sum-res{font:800 52px/1 var(--f-display);margin-top:4px}
.be{font-size:14px;color:var(--ink-2);max-width:40ch}
.bars{display:grid;gap:8px;padding:12px 14px 6px}
.bar-row{display:grid;grid-template-columns:82px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--sunk)}
.bar span{display:block;height:100%;background:var(--c)}
.c-tix{--c:var(--good)} .c-inc{--c:color-mix(in srgb, var(--good) 45%, var(--surface))}
.c-fee{--c:var(--pink)} .c-cost{--c:var(--blue)}
.bar-key{display:flex;flex-wrap:wrap;gap:4px 14px;padding:4px 14px 14px;margin:0;font-size:12px;color:var(--ink-2)}
.bar-key span{display:inline-flex;align-items:center;gap:5px}
.open-pay{margin:0;padding:10px 14px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.open-pay strong{color:var(--warn)}
.inp{width:100%;font:500 16px var(--f-mono);padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);color:var(--ink);min-width:0}
.inp::placeholder{color:var(--ink-3);font-family:var(--f-body);font-size:14px}
.inp:disabled{opacity:.7}

/* Ticketphasen & Kosten */
.c-paid{--c:var(--good)} .c-open{--c:var(--warn)}
.warn-t{color:var(--warn)}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"n v p" "b b b";align-items:center;gap:6px 12px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.cat-n{grid-area:n;overflow-wrap:anywhere}
.cat .num{grid-area:v;text-align:right}

@media (min-width:560px){.cat{grid-template-columns:11em minmax(0,1fr) auto auto;grid-template-areas:"n b v p"}}
.rows > li.grp{display:flex;justify-content:space-between;gap:10px;padding:9px 14px 7px;background:var(--sunk);font:600 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.grp .num{color:var(--ink);font-size:12.5px;letter-spacing:0}
.ledger{display:grid;gap:5px;padding:8px 14px 14px;font-size:14px;color:var(--ink-2)}

.ledger .num{color:var(--ink)}
.ledger .tot{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font-weight:600;color:var(--ink)}
.ledger .tot .num.pos{color:var(--good)} .ledger .tot .num.neg{color:var(--bad)}

/* Einschätzen */

.d.sf{box-shadow:inset 0 -3px 0 var(--c2)}
.sw-u{width:12px;height:3px;border-radius:2px;background:var(--ink-3);display:inline-block}
.as-row{display:grid;gap:10px;padding:12px 14px}
.as-main{text-align:left;background:none;border:0;padding:0;cursor:pointer;min-width:0;display:block;width:100%}
.as-main:disabled{cursor:default}
.as-bottom{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.as-ev{font-size:12.5px;color:var(--ink-2)}
.seg.rate button[aria-pressed="true"][data-v="gut"]{background:var(--good-soft);color:var(--good)}
.seg.rate button[aria-pressed="true"][data-v="meiden"]{background:var(--bad-soft);color:var(--bad)}
.seg.rate button:disabled{cursor:default}

/* Partys in der Region */
.d.lp::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.d.ev.lp::after{background:var(--pink-ink)}
.d.lp.lp-ok::after{background:var(--good)}
.d.lp.lp-bad::after{background:var(--bad)}
.lp-row .row-main{display:grid;gap:8px}

.sw.lp{background:var(--blue);border-radius:50%}
.alert.info a{color:var(--blue)}
.seg.view{margin:0 0 14px}
.lp-row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px}

.lp-d .wd{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.lp-d .dd{font:800 26px/1 var(--f-display);color:var(--blue)}
.lp-row .row-title a{color:var(--ink);text-decoration:none}
.lp-row .row-title a:hover{text-decoration:underline}
.clash{color:var(--warn);font-weight:600}
.sw-tg{flex:none;width:42px;height:24px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;padding:0;margin:0}

.tg-li{display:flex;align-items:center;gap:4px;padding-left:14px}

.is-off .row-title,.is-off .row-sub,.is-off .lp-d,.is-off .seg{opacity:.45}
.is-off .row-title{text-decoration:line-through}
.search{margin:0 0 14px;position:relative}
.search input{font:400 16px var(--f-body);padding:10px 12px 10px 38px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);width:100%;min-height:46px;box-shadow:var(--shadow)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.add-new{padding:14px;display:grid;gap:10px;justify-items:start}
.add-new p{margin:0}
.w-st{font-size:12.5px;color:var(--ink-2)}
.pill.ext{background:var(--pink-soft);color:var(--pink)}
a.pill{text-decoration:none;cursor:pointer}
a.pill:hover{text-decoration:underline}
a.pill.st-ok,.alert a.pill.st-ok{color:var(--good)}
.lp-act{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.lp-act .btn-ghost{padding:0 6px}
.link-card{padding:0 14px 14px;display:grid;gap:8px;font-size:14px}
.link-card .lt{font:800 22px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
.link-card .lt a{color:inherit;text-decoration:none}
.link-card .lt a:hover{text-decoration:underline}
.link-card .ls{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;color:var(--ink-2);font-size:13px}
.link-card .alert{margin:4px 0 0}
.lp-sum{background:var(--sunk);border-radius:var(--r);padding:10px 12px;margin:0 0 14px;font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}

/* Terminfinder */
.seg a{display:inline-block;color:var(--ink-2);font:600 13px var(--f-body);padding:7px 13px;border-radius:999px;text-decoration:none}
.seg a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.fd-ctrl{display:grid;gap:12px;padding:4px 14px 14px}
.fd-ctrl .two{gap:10px}
.fd-ctrl .qf input,.fd-ctrl .qf select{font-size:15px}
.wd-chips{display:flex;flex-wrap:wrap;gap:6px}
.wd-chips .chip{min-width:44px;justify-content:center}
.fd-sum{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;padding:10px 14px;border-top:1px solid var(--line);background:var(--sunk);font-size:13px;color:var(--ink-2)}
.fd-row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.fd-row .lp-d .dd{color:var(--pink)}
.fd-row .lp-d .mm{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.fd-main{flex:1;min-width:0;display:grid;gap:6px}
.fd-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.fd-head .row-title{display:inline}
.score{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--f-mono);color:var(--ink-2)}
.score .bar{width:56px;height:6px}
.score .bar span{background:var(--c)}
.sc-top{--c:var(--good)} .sc-gut{--c:color-mix(in srgb, var(--good) 60%, var(--blue))} .sc-ok{--c:var(--warn)} .sc-bad{--c:var(--bad)}
.rs-list{display:flex;flex-wrap:wrap;gap:5px}
.rs{display:inline-flex;align-items:center;font:500 12px/1.2 var(--f-body);padding:4px 8px;border-radius:999px;background:var(--sunk);color:var(--ink-2)}
.rs.plus{background:var(--good-soft);color:var(--good)}
.rs.minus{background:var(--warn-soft);color:var(--ink)}
.fd-row .btn{flex:none;align-self:center}
@media (max-width:420px){.fd-row{flex-wrap:wrap}.fd-row .btn{margin-left:48px}}

/* Monatsübersicht */
.month h3 a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:2px}
.month h3{flex-wrap:wrap;row-gap:2px}
.month{overflow:hidden}
.month h3 a svg{width:14px;height:14px;color:var(--ink-3)}
.month h3 a:hover{text-decoration:underline}
.mgrid.big{gap:4px}
.mgrid.big .h{font-size:11px;padding-bottom:4px}
.md{min-height:58px;border:0;border-radius:8px;background:var(--surface);padding:5px 5px 4px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;font:inherit;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}

.md-lbl{display:none;font-size:11px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-lbl.e{color:var(--pink);font-weight:600} .md-lbl.p{color:var(--blue)} .md-lbl.pb{color:var(--bad)} .md-lbl.pg{color:var(--good)} .md-lbl.h{color:var(--ink-2)}
@media (min-width:600px){.md{min-height:86px}.md-dots{display:none}.md-lbl{display:block}}
/* Monatsansicht: Monatsname und Pfeile bleiben beim Scrollen stehen */
.mv-head{position:sticky;top:calc(env(safe-area-inset-top, 0px) + var(--top-h, 50px));z-index:10;background:var(--paper);margin:0 0 6px;padding:6px 0 10px;flex-wrap:nowrap;align-items:center}
.mv-head::after{content:"";position:absolute;left:0;right:0;top:100%;height:12px;background:linear-gradient(var(--paper),transparent);pointer-events:none}
.mv-head h1{font-size:clamp(30px, 9vw, 44px);min-width:0}
.mv-head .year-nav{flex:none}
.agenda-day{padding:10px 14px;border-top:1px solid var(--line);display:grid;gap:6px}
.agenda-day h4{margin:0;font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.agenda-day ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.agenda-day li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:14px}
.preset{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}

/* Line-up */
.lu{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:12px;align-items:center}
.lu .time{font:500 13px var(--f-mono);color:var(--ink-2)}
.lu .who{display:block;font:800 23px/1 var(--f-display);text-transform:uppercase;overflow-wrap:anywhere}
.lu-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.lu.off .who{text-decoration:line-through;color:var(--ink-3)}
.fl-tech{list-style:none;margin:0;padding:0 14px 10px;display:grid;gap:4px;font-size:14px}
.fl-tech li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--pink);margin-right:8px;vertical-align:middle}
.fl-sub{padding:0 14px 8px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;color:var(--ink-2)}
.fl-acts{border-top:1px solid var(--line);padding:10px 14px;display:grid;gap:6px;font-size:14px}
.fl-acts .ln{display:flex;gap:10px;align-items:baseline}
.fl-acts .t{font:500 12.5px var(--f-mono);color:var(--ink-2);min-width:84px}
.set-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.field .got .check,.field .act-checks .check{text-transform:none;letter-spacing:0;font:400 14.5px/1.3 var(--f-body);color:var(--ink);width:100%}
.field .got .check input,.field .act-checks .check input{flex:none}
.act-checks{display:grid;gap:2px}
.br-sub{padding:0 14px 10px;font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.br-sub .btn-ghost{padding:0 4px;min-height:30px}
.br-row{display:grid;gap:8px;padding:12px 14px}
.br-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.br-top .who{font:800 20px/1 var(--f-display);text-transform:uppercase;overflow-wrap:anywhere;min-width:0}
.br-bottom{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.got{display:flex;flex-wrap:wrap;gap:5px}
.got button{font:600 12px var(--f-body);padding:5px 9px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--ink-3);cursor:pointer}
.got button[aria-pressed="true"]{border-style:solid;border-color:var(--good-soft);background:var(--good-soft);color:var(--good)}
.got button:disabled{cursor:default}

function calc(e){
  const L = S.lineup.filter(l => l.eventId === e.id && l.status !== 'abgesagt');
  const M = S.money.filter(m => m.eventId === e.id);
  const P = S.phases.filter(p => p.eventId === e.id);
  const out = M.filter(m => m.kind === 'ausgabe'), inc = M.filter(m => m.kind === 'einnahme');
  const fees = sum(L, l => l.fee), feesOpen = sum(L.filter(l => !l.paid), l => l.fee);
  const costSum = sum(out, m => m.amount), costOpen = sum(out.filter(m => !m.paid), m => m.amount);
  const incSum = sum(inc, m => m.amount);
  const pr = p => num(p.price) || 0, ct = p => int(p.count) || 0;
  const tickets = P.reduce((s, p) => s + pr(p) * ct(p), 0);
  const guests = P.reduce((s, p) => s + ct(p), 0);
  const paidGuests = P.reduce((s, p) => s + (pr(p) > 0 ? ct(p) : 0), 0);
  const prices = P.map(pr).filter(x => x > 0);
  const totalIn = tickets + incSum, totalOut = fees + costSum;
  const avg = paidGuests > 0 && tickets > 0 ? tickets / paidGuests : (prices.length ? prices.reduce((a, b) => a + b, 0) / prices.length : 0);
  const breakEven = avg > 0 ? Math.max(0, Math.ceil((totalOut - incSum) / avg - 1e-9)) : null;
  return { fees, feesOpen, costSum, costOpen, incSum, tickets, guests, paidGuests, totalIn, totalOut, result: totalIn - totalOut, avg, breakEven,
    open: feesOpen + costOpen, perGuest: guests > 0 ? totalOut / guests : null, hasNumbers: totalIn > 0 || totalOut > 0 };
}

async function save(fn, ok){
  if (!db) { toast('Keine Verbindung zur Datenbank.'); return false; }
  if (S.ro) { toast('Du kannst hier nur lesen.'); return false; }
  const fail = e => {
    const c = e && e.code;
    if (c === 'invalid_argument' && S.canWrite !== true) { S.ro = true; render(); toast('Du hast nur Lesezugriff. Bitte um eine Einladung als Bearbeiter.'); }
    else if (c === 'quota_exceeded') toast('Die Datenbank ist voll. Lösche alte Einträge und versuche es noch einmal.');
    else if (c === 'revoked') { S.conn = 'revoked'; render(); }
    else { toast('Speichern hat nicht geklappt. Prüfe deine Verbindung und versuche es noch einmal.'); console.error(e); }
    return false;
  };
  try { await fn(); if (ok) toast(ok); return true; }
  catch (e) {
    if (e && e.code === 'unavailable') {
      await new Promise(r => setTimeout(r, 400 + Math.random() * 700));
      try { await fn(); if (ok) toast(ok); return true; } catch (e2) { return fail(e2); }
    }
    return fail(e);
  }
}

async function mkShrink(file){
  const url = URL.createObjectURL(file);

    const im = await mkLoadImg(url), k = Math.min(1, 1440 / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    let q = 0.85, d = c.toDataURL('image/jpeg', q);

  } finally { URL.revokeObjectURL(url); }
}

async function mkInstaBlob(src){

  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = '#091C41'; g.fillRect(0, 0, W, H);
  const k = Math.min(W / im.naturalWidth, H / im.naturalHeight), w = im.naturalWidth * k, h = im.naturalHeight * k;

}

async function doDelete(kind, id){
  if (kind === 'event') {
    const kids = [];
    ['lineup', 'money', 'tasks', 'phases', 'floors'].forEach(c => S[c].forEach(x => { if (x.eventId === id) kids.push(c + '/' + x.id); }));
    const ok = await save(async () => { await db.doc('events/' + id).delete(); await Promise.all(kids.map(p => db.doc(p).delete())); }, 'Event gelöscht');
    if (ok) location.hash = 'events';
    return;
  }
  if (kind === 'floor') {
    const L = S.lineup.filter(l => l.floorId === id);
    if (await save(async () => { await db.doc('floors/' + id).delete(); for (const l of L) await db.doc('lineup/' + l.id).update({ floorId:'' }); }, 'Floor gelöscht')) closeSheet();
    return;
  }
  if (kind === 'techset') { if (await save(() => db.doc('techsets/' + id).delete(), 'Setup gelöscht')) techsetsSheet(); return; }
  if (kind === 'person') { S.afterPeople = 'team'; if (!await save(() => db.doc('people/' + id).delete(), 'Aus dem Team entfernt')) S.afterPeople = null; return; }
  const col = { lineup:'lineup', money:'money', task:'tasks', blocker:'blockers', phase:'phases', watch:'watch' }[kind];
  if (col && await save(() => db.doc(col + '/' + id).delete(), kind === 'watch' ? 'Entfernt. Seine Partys verschwinden aus der Liste.' : 'Gelöscht')) closeSheet();
}
function arm(el, fn){
  if (el.dataset.armed === '1') { el.disabled = true; fn(); return; }
  const old = el.innerHTML;
  el.dataset.armed = '1'; el.classList.add('armed'); el.textContent = 'Wirklich löschen?';
  setTimeout(() => { if (el.isConnected && el.dataset.armed === '1') { el.dataset.armed = ''; el.classList.remove('armed'); el.innerHTML = old; } }, 4000);
}

    }
  }, 'Checkliste eingefügt');

document.addEventListener('pointerdown', ev => {
  const hd = ev.target.closest('.w-rs'); if (!hd) return;
  const cell = hd.closest('.wcell'); if (!cell) return;
  ev.preventDefault();
  const cols = getComputedStyle(cell.parentNode).gridTemplateColumns.split(' ').length;
  wDrag = { k:cell.dataset.w, cell, x:ev.clientX, y:ev.clientY, from:wSize(cell.dataset.w), to:wSize(cell.dataset.w), moved:false, cols };
  cell.classList.add('drag');
  try { hd.setPointerCapture(ev.pointerId); } catch (e) {}
});
document.addEventListener('pointermove', ev => {
  if (!wDrag) return;
  const d = wDrag.cols > 1 ? ev.clientX - wDrag.x : ev.clientY - wDrag.y;
  if (Math.abs(d) > 8) wDrag.moved = true;
  const step = wDrag.cols > 1 ? Math.max(80, wDrag.cell.parentNode.clientWidth / wDrag.cols * 0.6) : 70;
  const i = Math.max(0, Math.min(2, W_SIZES.indexOf(wDrag.from) + Math.round(d / step)));
  const to = W_SIZES[i];
  if (to !== wDrag.to) { wDrag.cell.classList.remove('ws-' + wDrag.to); wDrag.cell.classList.add('ws-' + to); wDrag.to = to; const l = wDrag.cell.querySelector('.w-size'); if (l) l.textContent = W_SIZE_LABEL[to]; }
});
function wDragEnd(){
  if (!wDrag) return;
  const g = wDrag; wDrag = null; g.cell.classList.remove('drag');
  const to = g.moved ? g.to : W_SIZES[(W_SIZES.indexOf(g.from) + 1) % 3];
  if (to !== g.from) { wSetSize(g.k, to); toast(WIDGETS.find(w => w[0] === g.k)[1] + ': ' + W_SIZE_LABEL[to]); }
  render();
}
document.addEventListener('pointerup', wDragEnd);
document.addEventListener('pointercancel', wDragEnd);
document.addEventListener('input', onField);
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSheet(); else if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('wopt')) { ev.preventDefault(); ev.target.click(); } });
$('#sheet').addEventListener('click', ev => { if (ev.target.id === 'sheet') closeSheet(); });
window.addEventListener('hashchange', () => { closeSheet(); render(); window.scrollTo(0, 0); });
// Klick auf „RaveBüro“ oben links: immer zurück zur Startseite (Events), egal von wo
document.querySelector('.mark').addEventListener('click', ev => {
  ev.preventDefault();
  if (window.firebase && !projekt) return;
  closeSheet();
  if (location.hash !== '#events') location.hash = '#events';
  else { render(); window.scrollTo(0, 0); }
});

init();
})();
</script>
